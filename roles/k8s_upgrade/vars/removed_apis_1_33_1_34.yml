---
# Removed API versions for the Kubernetes 1.33 -> 1.34 upgrade hop.
#
# IMPORTANT: Verify this list against the official release notes before use:
#   https://kubernetes.io/docs/reference/using-api/deprecation-guide/
#   https://github.com/kubernetes/kubernetes/blob/master/CHANGELOG/CHANGELOG-1.34.md
#
# Format:
#   group:       API group (e.g. flowcontrol.apiserver.k8s.io)
#   versions:    list of removed API versions (used to query /apis/<group>/<version>/<resource>)
#   replacement: the stable version operators should migrate to
#   resources:   resource types in this group (used by the hardcoded map path in preflight_apis.yml)
#
# When k8s_upgrade_use_pluto: false, preflight_apis.yml queries each combination
# of group/versions[0]/resources[0] via kubectl --raw. Add additional entries
# for each distinct API group that is removed in this version.
#
# When k8s_upgrade_use_pluto: true this file is still loaded but the list is
# not used for querying - Pluto handles detection automatically.

k8s_removed_apis:
  # flowcontrol.apiserver.k8s.io/v1beta3 was deprecated in 1.31 with planned
  # removal after 3 releases (1.34). Verify against the 1.34 changelog.
  - group: "flowcontrol.apiserver.k8s.io"
    versions:
      - "v1beta3"
    replacement: "v1"
    resources:
      - "flowschemas"
      - "prioritylevelconfigurations"

  # Add additional removed API groups for this version hop below.
  # Template:
  # - group: "example.k8s.io"
  #   versions:
  #     - "v1beta1"
  #   replacement: "v1"
  #   resources:
  #     - "someresource"
