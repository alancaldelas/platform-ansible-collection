# SPDX-License-Identifier: MIT-0
---
galaxy_info:
  role_name: k8s_upgrade
  author: alancaldelas
  description: >
    In-place Kubernetes minor version upgrade for single-node kubeadm clusters.
    Enforces pre-flight checks, etcd snapshot, and gated upgrade execution.
    Structured to be extended for multi-node HA clusters in the future.
  license: MIT-0
  min_ansible_version: "2.14"
  platforms:
    - name: Ubuntu
      versions:
        - jammy
        - noble
    - name: EL
      versions:
        - "8"
        - "9"

dependencies: []
