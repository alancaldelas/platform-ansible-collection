# SPDX-License-Identifier: MIT-0
---
# Additional control plane node upgrade.
#
# Additional control plane nodes use "kubeadm upgrade node" (NOT "kubeadm upgrade apply").
# kubeadm upgrade apply is only run once on the primary control plane.
#
# Order:
#   1. Add the target version repository
#   2. Upgrade kubeadm package
#   3. Run kubeadm upgrade node
#   4. Optional: cordon and drain
#   5. Upgrade kubelet and kubectl
#   6. Reload systemd and restart kubelet
#   7. Optional: uncordon
#   8. Wait for node to return to Ready

- name: "upgrade_additional_cp | set target version repo minor"
  set_fact:
    _upg_repo_major: "{{ k8s_upgrade_target_version.split('.')[0] }}"
    _upg_repo_minor: "{{ k8s_upgrade_target_version.split('.')[1] }}"

# ---------------------------------------------------------------------------
# 1. Repository update
# ---------------------------------------------------------------------------

- name: "upgrade_additional_cp | repo | install signing key (Debian)"
  shell: |
    curl -fsSL https://pkgs.k8s.io/core:/stable:/v{{ _upg_repo_major }}.{{ _upg_repo_minor }}/deb/Release.key |
    gpg --batch --yes --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  become: true
  when: ansible_distribution == "Ubuntu"

- name: "upgrade_additional_cp | repo | add apt repository (Debian)"
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v{{ _upg_repo_major }}.{{ _upg_repo_minor }}/deb/ /"
    state: present
    filename: kubernetes
    update_cache: true
  become: true
  when: ansible_distribution == "Ubuntu"

- name: "upgrade_additional_cp | repo | add yum/dnf repository (RedHat)"
  yum_repository:
    name: kubernetes
    description: "Kubernetes v{{ _upg_repo_major }}.{{ _upg_repo_minor }}"
    baseurl: "https://pkgs.k8s.io/core:/stable:/v{{ _upg_repo_major }}.{{ _upg_repo_minor }}/rpm/"
    gpgcheck: true
    gpgkey: "https://pkgs.k8s.io/core:/stable:/v{{ _upg_repo_major }}.{{ _upg_repo_minor }}/rpm/repodata/repomd.xml.key"
    enabled: true
  become: true
  when: ansible_os_family == "RedHat"

# ---------------------------------------------------------------------------
# 2. Upgrade kubeadm
# ---------------------------------------------------------------------------

- name: "upgrade_additional_cp | kubeadm | unhold package (Debian)"
  command: apt-mark unhold kubeadm
  become: true
  changed_when: true
  when: ansible_distribution == "Ubuntu"

- name: "upgrade_additional_cp | kubeadm | install target version (Debian)"
  apt:
    name: "kubeadm={{ k8s_upgrade_target_version }}*"
    state: present
    update_cache: false
    allow_downgrade: false
  become: true
  when: ansible_distribution == "Ubuntu"

- name: "upgrade_additional_cp | kubeadm | hold package (Debian)"
  command: apt-mark hold kubeadm
  become: true
  changed_when: true
  when: ansible_distribution == "Ubuntu"

- name: "upgrade_additional_cp | kubeadm | install target version (RedHat yum)"
  yum:
    name: "kubeadm-{{ k8s_upgrade_target_version }}"
    state: present
    update_cache: false
  become: true
  when:
    - ansible_os_family == "RedHat"
    - ansible_pkg_mgr == "yum"

- name: "upgrade_additional_cp | kubeadm | install target version (RedHat dnf)"
  dnf:
    name: "kubeadm-{{ k8s_upgrade_target_version }}"
    state: present
    update_cache: false
  become: true
  when:
    - ansible_os_family == "RedHat"
    - ansible_pkg_mgr in ["dnf", "dnf5"]

# ---------------------------------------------------------------------------
# 3. kubeadm upgrade node (additional control plane specific command)
#
# Before running, wait for the primary apiserver to be fully responsive.
# When the previous node's etcd was upgraded, there is a brief mixed-version
# window that can temporarily disrupt the apiserver. Starting the next node's
# upgrade before the apiserver stabilises causes kubeadm to fail on the
# addon/kube-proxy phase even though the static pod upgrades succeed.
# ---------------------------------------------------------------------------

- name: "upgrade_additional_cp | preflight | wait for primary apiserver ready to serve"
  command: kubectl get configmap kubeadm-config -n kube-system
  register: _apiserver_cm_check
  until: _apiserver_cm_check.rc == 0
  retries: 36
  delay: 10
  changed_when: false
  delegate_to: "{{ groups[k8s_upgrade_primary_group][0] }}"
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

- name: "upgrade_additional_cp | kubeadm | run upgrade node"
  command: kubeadm upgrade node
  register: _kubeadm_node_upgrade
  become: true
  # Retry: if kubeadm fails before any static pods are touched (e.g. it
  # cannot read kubeadm-config because the primary apiserver is briefly down
  # during the etcd mixed-version transition), it is safe to retry - nothing
  # has been changed on the node yet. Once static pods start upgrading the
  # success string appears in stdout; we stop retrying at that point.
  retries: 12
  delay: 30
  until: >-
    _kubeadm_node_upgrade.rc == 0 or
    'The control plane instance for this node was successfully upgraded'
    in (_kubeadm_node_upgrade.stdout | default(''))
  changed_when: >-
    'The control plane instance for this node was successfully upgraded'
    in (_kubeadm_node_upgrade.stdout | default(''))
  # Only hard-fail if retries are exhausted AND the static pod upgrade never
  # completed. Addon-phase failures (kube-proxy check timing out) are tolerated
  # because the critical upgrade path already succeeded.
  failed_when:
    - _kubeadm_node_upgrade.rc != 0
    - "'The control plane instance for this node was successfully upgraded' not in (_kubeadm_node_upgrade.stdout | default(''))"

- name: "upgrade_additional_cp | kubeadm | show upgrade node output"
  debug:
    var: _kubeadm_node_upgrade.stdout_lines

# ---------------------------------------------------------------------------
# 3b. Patch apiserver manifest to include all etcd endpoints (HA only)
#
# kubeadm upgrade node rewrites the apiserver manifest on this node with only
# the local etcd endpoint. Patch it to include all members so this node's
# apiserver survives the mixed-version etcd window.
# ---------------------------------------------------------------------------

- name: "upgrade_additional_cp | etcd | build all-member endpoint list"
  set_fact:
    _all_etcd_endpoints: >-
      {{
        (groups[k8s_upgrade_primary_group] | default([]) +
         groups[k8s_upgrade_additional_group] | default([]))
        | unique
        | map('extract', hostvars, 'ansible_host')
        | select('defined')
        | map('regex_replace', '^(.*)$', 'https://\1:2379')
        | join(',')
      }}
  when:
    - k8s_upgrade_additional_group | default('') != ''
    - groups[k8s_upgrade_additional_group] | default([]) | length > 0

- name: "upgrade_additional_cp | etcd | patch apiserver manifest to use all etcd endpoints"
  replace:
    path: /etc/kubernetes/manifests/kube-apiserver.yaml
    regexp: '(--etcd-servers=)\S+'
    replace: '\1{{ _all_etcd_endpoints }}'
  become: true
  when:
    - k8s_upgrade_additional_group | default('') != ''
    - groups[k8s_upgrade_additional_group] | default([]) | length > 0
    - _all_etcd_endpoints is defined

# ---------------------------------------------------------------------------
# 4. Optional drain
# ---------------------------------------------------------------------------

- name: "upgrade_additional_cp | drain | cordon node"
  command: kubectl cordon {{ ansible_hostname }}
  delegate_to: "{{ groups[k8s_upgrade_primary_group][0] }}"
  changed_when: true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  when: k8s_upgrade_drain_node | bool

- name: "upgrade_additional_cp | drain | drain node"
  command: >
    kubectl drain {{ ansible_hostname }}
    --ignore-daemonsets
    --delete-emptydir-data
    --timeout={{ k8s_upgrade_drain_timeout }}
    --grace-period={{ k8s_upgrade_drain_grace_period }}
  delegate_to: "{{ groups[k8s_upgrade_primary_group][0] }}"
  changed_when: true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  when: k8s_upgrade_drain_node | bool

# ---------------------------------------------------------------------------
# 5. Upgrade kubelet and kubectl
# ---------------------------------------------------------------------------

- name: "upgrade_additional_cp | kubelet | unhold packages (Debian)"
  command: apt-mark unhold kubelet kubectl
  become: true
  changed_when: true
  when: ansible_distribution == "Ubuntu"

- name: "upgrade_additional_cp | kubelet | install target versions (Debian)"
  apt:
    name:
      - "kubelet={{ k8s_upgrade_target_version }}*"
      - "kubectl={{ k8s_upgrade_target_version }}*"
    state: present
    update_cache: false
    allow_downgrade: false
  become: true
  when: ansible_distribution == "Ubuntu"

- name: "upgrade_additional_cp | kubelet | hold packages (Debian)"
  command: apt-mark hold kubelet kubectl
  become: true
  changed_when: true
  when: ansible_distribution == "Ubuntu"

- name: "upgrade_additional_cp | kubelet | install target versions (RedHat yum)"
  yum:
    name:
      - "kubelet-{{ k8s_upgrade_target_version }}"
      - "kubectl-{{ k8s_upgrade_target_version }}"
    state: present
  become: true
  when:
    - ansible_os_family == "RedHat"
    - ansible_pkg_mgr == "yum"

- name: "upgrade_additional_cp | kubelet | install target versions (RedHat dnf)"
  dnf:
    name:
      - "kubelet-{{ k8s_upgrade_target_version }}"
      - "kubectl-{{ k8s_upgrade_target_version }}"
    state: present
  become: true
  when:
    - ansible_os_family == "RedHat"
    - ansible_pkg_mgr in ["dnf", "dnf5"]

# ---------------------------------------------------------------------------
# 6. Restart kubelet
#
# 6a. Scrub flags removed in 1.35 from kubeadm-flags.env before restarting.
#     kubeadm upgrade node does not always remove deprecated flags from
#     /var/lib/kubelet/kubeadm-flags.env when the static pod manifests are
#     already at the target version (the "equal, skipping" path).
#     --pod-infra-container-image was removed in 1.35; kubelet refuses to start
#     if it is still present in the env file.
# ---------------------------------------------------------------------------

- name: "upgrade_additional_cp | kubelet | remove deprecated flags from kubeadm-flags.env"
  replace:
    path: /var/lib/kubelet/kubeadm-flags.env
    regexp: '\s*--pod-infra-container-image=\S+'
    replace: ''
  become: true

- name: "upgrade_additional_cp | kubelet | daemon-reload and restart"
  systemd:
    name: kubelet
    state: restarted
    daemon_reload: true
    enabled: true
  become: true

# ---------------------------------------------------------------------------
# 7. Uncordon (only if we drained)
# ---------------------------------------------------------------------------

- name: "upgrade_additional_cp | drain | uncordon node"
  command: kubectl uncordon {{ ansible_hostname }}
  delegate_to: "{{ groups[k8s_upgrade_primary_group][0] }}"
  changed_when: true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  when: k8s_upgrade_drain_node | bool

# ---------------------------------------------------------------------------
# 8. Wait for node Ready
# ---------------------------------------------------------------------------

- name: "upgrade_additional_cp | verify | wait for node to return to Ready"
  command: >
    kubectl get node {{ ansible_hostname }}
    -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
  register: _node_ready_check
  until: _node_ready_check.stdout == "True"
  retries: 24
  delay: 10
  changed_when: false
  delegate_to: "{{ groups[k8s_upgrade_primary_group][0] }}"
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

- name: "upgrade_additional_cp | summary"
  debug:
    msg:
      - "Additional control plane upgrade complete."
      - "  From : {{ k8s_upgrade_from }}"
      - "  To   : {{ k8s_upgrade_target_version }}"
      - "  Node : {{ ansible_hostname }}"
