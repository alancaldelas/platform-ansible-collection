---
# cluster_upgrade defaults

k8s_upgrade_node_role: "{{ k8s_node_role | default('master') }}"

# CNI
k8s_cni_plugin: "{{ k8s_cni_plugin | default('cilium') }}"
cilium_version: "{{ cilium_version | default('1.19.6') }}"
cilium_gateway_api_enabled: false
# Keep in step with roles/k8s/defaults: every cilium upgrade must carry the
# IPAM setting or a values reset would fall back to cluster-pool 10.0.0.0/8.
cilium_ipam_mode: kubernetes
# cni.exclusive=false keeps Cilium from renaming other CNI configs such as
# Multus's 00-multus.conf out of /etc/cni/net.d.
cilium_base_flags: >-
  --set ipam.mode={{ cilium_ipam_mode }}
  {{ '--set cni.exclusive=false' if k8s_multus_enabled | default(true) | bool else '' }}

# K8s Upgrade
k8s_upgrade_from: ""
k8s_upgrade_to: ""
k8s_upgrade_target_version: ""

# Drain configuration
k8s_upgrade_drain_node: false
k8s_upgrade_drain_timeout: "300s"
k8s_upgrade_drain_grace_period: 30

k8s_upgrade_drain_worker_node: true
