---
# defaults file for k8s
user: amd

# Kubernetes version and configuration
kubernetes_version: "1.35.3"

# System validation requirements
k8s_min_cpu_cores: 2
k8s_min_memory_mb: 2048
k8s_min_disk_space_gb: 20
k8s_min_kernel_version: "4.15"

# Required mount points to check for disk space
k8s_required_mount_points:
  - "/"
  - "/var"

# Required kernel modules for Kubernetes
k8s_required_kernel_modules:
  - br_netfilter
  - overlay
  - ip_vs
  - ip_vs_rr
  - ip_vs_wrr
  - ip_vs_sh
  - nf_conntrack

# Kernel parameters for Kubernetes
k8s_kernel_parameters:
  - name: net.bridge.bridge-nf-call-iptables
    value: "1"
  - name: net.bridge.bridge-nf-call-ip6tables
    value: "1"
  - name: net.ipv4.ip_forward
    value: "1"
  - name: net.ipv4.conf.all.forwarding
    value: "1"
  - name: net.ipv6.conf.all.forwarding
    value: "1"
  - name: net.netfilter.nf_conntrack_max
    value: "131072"

# Required network endpoints for connectivity checks
k8s_required_endpoints:
  - "https://registry.k8s.io"
  - "https://github.com"
  - "https://download.docker.com"

# Network connectivity check control
k8s_check_network_connectivity: true

# Required ports that should be available (not in use)
# Control plane nodes require all of these.
k8s_required_ports:
  - 6443   # Kubernetes API server
  - 2379   # etcd server client API
  - 2380   # etcd server peer API
  - 10250  # Kubelet API
  - 10251  # kube-scheduler
  - 10252  # kube-controller-manager
  - 10255  # Read-only Kubelet API

# Worker nodes only need kubelet + NodePort range checked.
k8s_worker_required_ports:
  - 10250  # Kubelet API
  - 10255  # Read-only Kubelet API

# Enable multi-node specific pre-flight checks:
#   - Unique hostname and IP across cluster nodes
#   - openssl available on master (required to generate CA cert hash for join)
#   - Worker → master connectivity on ports 6443 and 2380
#   - DNS resolution warnings between nodes
#   - Master → worker kubelet port (10250) reachability after join
# These checks are gated by k8s_node_role and group membership so they
# are safely ignored on single-node deployments.
k8s_multinode_checks: true

# Common packages required for Kubernetes
k8s_required_packages:
  - curl
  - wget
  - ca-certificates
  - gnupg
  - openssl  # required on master to compute CA cert hash for kubeadm join

# Debian/Ubuntu specific packages
k8s_required_packages_debian:
  - apt-transport-https
  - software-properties-common
  - lsb-release

# RHEL/CentOS specific packages
k8s_required_packages_rhel:
  - yum-utils
  - device-mapper-persistent-data
  - lvm2

# Security and system configuration
# SELinux configuration: disabled, permissive, enforcing, or current (no change)
k8s_selinux_state: disabled
k8s_selinux_policy: targeted

# SELinux packages for Kubernetes (RHEL/CentOS only)
k8s_selinux_packages_rhel:
  - container-selinux
  - selinux-policy-base

# SELinux booleans for Kubernetes
k8s_selinux_booleans:
  - name: container_manage_cgroup
    state: yes
  - name: virt_use_nfs
    state: yes
  - name: virt_sandbox_use_all_caps
    state: yes

# Firewall configuration
k8s_disable_firewall: false

# Container runtime integration
k8s_container_runtime: containerd  # containerd, crio, docker
k8s_manage_container_runtime: true  # Whether this role should manage container runtime installation

# Node role configuration
# master  - initialises the control plane (kubeadm init)
# worker  - joins an existing cluster (kubeadm join)
k8s_node_role: master

# Cluster configuration
k8s_cluster_name: kubernetes
k8s_pod_subnet: "10.244.0.0/16"
k8s_service_subnet: "10.96.0.0/12"

# Control plane endpoint - used by workers to reach the API server.
# For single-node this defaults to the master's IP.
# For multi-node set this to a load balancer VIP or DNS name so workers
# do not hard-code a single master IP.
# REQUIRED when k8s_ha_enabled: true — kubeadm will reject HA init without it.
# Example: k8s_control_plane_endpoint: "k8s-api.example.com:6443"
k8s_control_plane_endpoint: ""

# HA control plane configuration.
# Set to true when deploying multiple control plane nodes (stacked etcd).
# When true, kubeadm init runs with --upload-certs so additional control
# plane nodes can pull the PKI via kubeadm join --control-plane.
# k8s_control_plane_endpoint must also be set (a LB VIP or DNS name).
k8s_ha_enabled: false

# Ansible group name that contains the PRIMARY control plane node (ran init).
# Used by workers and additional CP nodes to delegate token/cert generation.
k8s_master_group: "k8s_masters"

# Ansible group name for ADDITIONAL control plane nodes (control_plane_join).
# Only used by the HA playbook for documentation/reference — the role itself
# uses k8s_node_role to determine behaviour on each host.
k8s_cp_join_group: "k8s_control_planes"

# kubeadm configuration
k8s_kubeadm_init_extra_args: ""
k8s_kubeadm_join_extra_args: ""

# Token TTL for the join token generated on the master.
# Defaults to 1h - long enough for a normal playbook run.
k8s_join_token_ttl: "1h"

# Feature gates (optional)
k8s_feature_gates: []

# Additional kubelet arguments
k8s_kubelet_extra_args: ""

# CNI plugin selection
k8s_cni_plugin: cilium  # calico, flannel, weave, cilium
k8s_install_cni: true  # Whether to install CNI plugin automatically

# CNI plugin versions
cilium_version: "1.19.6"
calico_version: "3.25.0"
flannel_version: "latest"
weave_version: "2.8.1"

# Cilium Gateway API support (cilium only). Installs the Gateway API CRDs
# and enables Cilium's Gateway API implementation. Requires kube-proxy
# replacement, which these flags also enable.
cilium_gateway_api_enabled: false
gateway_api_version: "v1.4.1"  # must match the version supported by cilium_version
# Binding listener ports <= 1023 in host-network mode needs NET_BIND_SERVICE
# granted to the Envoy container AND kept by the starter process
# (keepCapNetBindService). Both are required per the Cilium docs.
cilium_gateway_api_flags: >-
  --set kubeProxyReplacement=true
  --set gatewayAPI.enabled=true
  --set gatewayAPI.hostNetwork.enabled=true
  --set envoy.securityContext.capabilities.keepCapNetBindService=true
  --set envoy.securityContext.capabilities.envoy={NET_ADMIN,SYS_ADMIN,NET_BIND_SERVICE}

# Source installation configuration
k8s_build_user: "{{ user | default(ansible_user) }}"
k8s_install_from_source: false

# Go configuration for source builds
go_version: "1.21.3"
go_url: "https://golang.org/dl"
go_tarball: "go{{ go_version }}.linux-amd64.tar.gz"

# Kubernetes source repository configuration
k8s_repo: "https://github.com/kubernetes/kubernetes.git"
k8s_branch: "v{{ kubernetes_version }}"
k8s_dir: "/opt/kubernetes"

# Multus CNI
k8s_multus_enabled: false
multus_version: "v4.1.4"
