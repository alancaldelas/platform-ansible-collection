---
- name: Cluster Upgrade
  hosts: all
  become: true
  serial: 1
  any_errors_fatal: true
  
  vars:
    # Set these variables or pass them via --extra-vars
    k8s_upgrade_from: "1.33"
    k8s_upgrade_to: "1.34"
    k8s_upgrade_target_version: "1.34.0"
    k8s_cni_plugin: "cilium"
    cilium_version: "1.20.1"

  roles:
    - role: alancaldelas.kubernetes_baremetal.cluster_upgrade

