apiVersion: v1
kind: Namespace
metadata:
  name: uninstall-smoke
---
apiVersion: v1
kind: Pod
metadata:
  name: web
  namespace: uninstall-smoke
  labels:
    app: uninstall-web
spec:
  containers:
    - name: web
      image: registry.k8s.io/e2e-test-images/agnhost:2.53
      args: [netexec, --http-port=8080]
      ports:
        - containerPort: 8080
      readinessProbe:
        httpGet:
          path: /healthz
          port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: uninstall-smoke
spec:
  selector:
    app: uninstall-web
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: uninstall-smoke
spec:
  containers:
    - name: client
      image: registry.k8s.io/e2e-test-images/busybox:1.29-4
      command: [sh, -c, 'echo uninstall-test > /data/proof; sleep 7200']
      volumeMounts:
        - name: local-data
          mountPath: /data
  volumes:
    - name: local-data
      emptyDir: {}
